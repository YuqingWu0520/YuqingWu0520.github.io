<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Helvetica Neue,Arial,sans-serif">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#9aa3a9"/></marker>
  <g id="lock"><rect x="-8" y="-2" width="16" height="12" rx="2.5" fill="currentColor"/><path d="M-5,-2v-4a5,5 0 0 1 10,0v4" fill="none" stroke="currentColor" stroke-width="2.2"/></g>
  <g id="pp"><circle cx="0" cy="-7" r="4.2"/><path d="M-7,8a7,7 0 0 1 14,0z"/></g>
</defs>
<rect width="1000" height="330" fill="#fbfaf7"/>
<!-- UK Biobank -->
<g transform="translate(40,95)">
  <rect width="250" height="140" rx="16" fill="#fff" stroke="#2f6f69" stroke-width="2.5"/>
  <text x="20" y="40" font-size="21" font-weight="700" fill="#1c2226">UK Biobank</text>
  <text x="20" y="62" font-size="13" fill="#2f6f69" font-weight="600">DEVELOP · Olink Explore</text>
  <g fill="#2f6f69" opacity=".85"><use href="#pp" x="30" y="98"/><use href="#pp" x="50" y="98"/><use href="#pp" x="70" y="98"/><use href="#pp" x="90" y="98"/><use href="#pp" x="110" y="98"/></g>
  <text x="126" y="104" font-size="12.5" fill="#4a5258">36,147 with Olink</text>
  <g color="#2f6f69" transform="translate(226,32)"><use href="#lock"/></g>
  <text x="20" y="128" font-size="11.5" fill="#69717a">LASSO-Cox · cross-validation · bootstrap</text>
</g>
<!-- arrows -->
<g stroke="#9aa3a9" stroke-width="2" fill="none" marker-end="url(#ah)">
  <path d="M292,150 C390,150 400,62 548,62"/>
  <path d="M292,165 C400,165 430,165 548,165"/>
  <path d="M292,180 C390,180 400,268 548,268"/>
</g>
<rect x="360" y="138" width="130" height="26" rx="13" fill="#f6ead3"/>
<text x="425" y="156" font-size="12.5" text-anchor="middle" fill="#7a5717" font-weight="700">fixed weights</text>
<!-- validation cohorts -->
<g transform="translate(550,22)">
  <rect width="410" height="80" rx="14" fill="#fff" stroke="#5c7894" stroke-width="2"/>
  <rect width="8" height="80" rx="4" fill="#5c7894"/>
  <text x="24" y="33" font-size="18" font-weight="700" fill="#1c2226">EPIC</text><text x="80" y="33" font-size="12.5" fill="#5c7894" font-weight="600">SomaScan · 10 European countries</text>
  <text x="24" y="58" font-size="12.5" fill="#4a5258">Transfer across proteomic platforms</text>
  <g color="#5c7894" transform="translate(386,28)"><use href="#lock"/></g>
</g>
<g transform="translate(550,125)">
  <rect width="410" height="80" rx="14" fill="#fff" stroke="#b8862f" stroke-width="2"/>
  <rect width="8" height="80" rx="4" fill="#b8862f"/>
  <text x="24" y="33" font-size="18" font-weight="700" fill="#1c2226">REACT</text><text x="92" y="33" font-size="12.5" fill="#9a6d1f" font-weight="600">Olink · community adults, England</text>
  <text x="24" y="58" font-size="12.5" fill="#4a5258">External validation · repeat blood samples</text>
  <g color="#b8862f" transform="translate(386,28)"><use href="#lock"/></g>
</g>
<g transform="translate(550,228)">
  <rect width="410" height="80" rx="14" fill="#fff" stroke="#a9584b" stroke-width="2"/>
  <rect width="8" height="80" rx="4" fill="#a9584b"/>
  <text x="24" y="33" font-size="18" font-weight="700" fill="#1c2226">Airwave</text><text x="104" y="33" font-size="12.5" fill="#a9584b" font-weight="600">Olink · police officers and staff</text>
  <text x="24" y="58" font-size="12.5" fill="#4a5258">External validation in a working-age cohort</text>
  <g color="#a9584b" transform="translate(386,28)"><use href="#lock"/></g>
</g>
<!-- legend -->
<g transform="translate(40,282)" color="#69717a"><use href="#lock" x="8" y="2"/></g>
<text x="62" y="290" font-size="12.5" fill="#69717a">each cohort analysed inside its own trusted research environment;</text>
<text x="62" y="307" font-size="12.5" fill="#69717a">only model weights and summary results move between them</text>
</svg>
